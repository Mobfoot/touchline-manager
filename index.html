<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Touchline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1630">
<title>Touchline Manager</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{background:#0b1630}
body{margin:0}
/* Layout: one phone-width column on a navy desk. Beveled blue title bars, pale zebra tables, gold for what matters (as on the original screens). Deliberately a single look. */
:root{
  --desk:#0b1630;--navy:#12285a;--blue:#2350a8;--panel:#ced7ea;--ink:#0b1226;
  --ra:#f2f5fb;--rb:#dfe6f3;--gold:#f5c542;--goldbg:#fde9a2;--line:#b3bfd8;
  --good:#0c7a34;--warn:#8a5a00;--bad:#a82424;--btn1:#eef1f8;--btn2:#a9b4cd;
  --bev-l:#f4f7ff;--bev-d:#5a6a92;
  --f:Verdana,Tahoma,"DejaVu Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:#e9effc;font:12px/1.4 var(--f);padding-inline:16px;margin:0}
button{font:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#hd{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#2d5fc0,#17387f);border:2px solid;border-color:#7da2ec #0a1a45 #0a1a45 #7da2ec}
#hd .t{min-width:0;flex:1}
#hd .club{font:700 15px var(--f);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .date{color:var(--gold);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{overflow-y:auto;overflow-x:hidden;min-height:0;padding-block:10px;-webkit-overflow-scrolling:touch}
#nav{display:grid;grid-template-columns:repeat(6,1fr);background:#17316e;border-top:2px solid #0a1a45}
#nav.ctl{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center;justify-content:center}
#nav .tab{background:#17316e;color:#cfdcff;border:0;border-bottom:3px solid transparent;padding:10px 0 8px;font-size:11px;cursor:pointer;min-width:0}
#nav .tab.on{background:#2350a8;color:#fff;border-bottom-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.panel{background:var(--panel);color:var(--ink);border:2px solid;border-color:var(--bev-l) var(--bev-d) var(--bev-d) var(--bev-l);margin-bottom:10px}
.ph{background:linear-gradient(#274e9c,#17387f);color:var(--gold);font:700 10.5px var(--f);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ph span:last-child{color:#cfdcff;font-weight:400;letter-spacing:0;text-transform:none}
.pb{padding:8px}
.pb p{margin:0 0 6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;color:var(--ink)}
th{background:#1b3f86;color:#dfe8ff;font:700 10px var(--f);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px;white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(odd) td{background:var(--ra)}
tbody tr:nth-child(even) td{background:var(--rb)}
tbody tr.me td{background:var(--goldbg);font-weight:700}
tbody tr.un td{color:#7a6a6a}
tbody tr.sel td{background:#b8d0ff}
td.n,th.n{text-align:right}
td.nm{max-width:140px;overflow:hidden;text-overflow:ellipsis}
tr[data-act]{cursor:pointer}
.a1{color:var(--bad)}.a2{color:var(--warn)}.a3{color:var(--ink)}.a4{color:var(--good);font-weight:700}
.w{color:var(--good);font-weight:700}.d{color:var(--warn);font-weight:700}.l{color:var(--bad);font-weight:700}
.btn{font:700 12px var(--f);color:#0d1c45;background:linear-gradient(var(--btn1),var(--btn2));border:2px solid;border-color:#fff #4f5c80 #4f5c80 #fff;padding:7px 12px;min-height:36px;cursor:pointer;touch-action:manipulation}
.btn:active{border-color:#4f5c80 #fff #fff #4f5c80}
.btn.on{background:linear-gradient(#ffe38a,#e0a919)}
.btn.go{background:linear-gradient(#ffe38a,#e0a919);padding:8px 14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;min-height:30px;font-size:11px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{background:#fff4c2;color:#3b2e00;border:1px solid #c9a900;padding:6px 8px;margin-bottom:10px}
.cb{display:inline-block;width:46px;height:7px;background:#aeb9d3;vertical-align:middle;margin-right:5px;border:1px solid #6d7ca2}
.cb i{display:block;height:100%;background:var(--blue)}
.cb.g i{background:var(--good)}.cb.w i{background:#d19a00}.cb.b i{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;text-align:center;align-items:center}
.cmp .lab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#3c4a70}
.cmp b{font-size:14px}
ul.news{list-style:none;margin:0;padding:0}
ul.news li{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr;gap:6px}
ul.news li:last-child{border:0}
ul.news .wk{color:#3c4a70;font-size:10px;padding-top:1px}
.big{font:700 18px var(--f)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 8px;background:linear-gradient(#17387f,#0e2252);color:#fff}
.sb .tn{font:700 13px var(--f);overflow:hidden;text-overflow:ellipsis}
.sb .tn:last-child{text-align:right}
.sb .sc{font:700 26px var(--f);color:var(--gold);letter-spacing:.05em;text-align:center}
.sb .clk{grid-column:1/-1;text-align:center;color:#cfdcff;font-size:11px}
.cl{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--ra)}
.cl .m{color:#3c4a70;font-variant-numeric:tabular-nums}
.cl.g{background:var(--goldbg);font-weight:700}
.cl.y{border-left:4px solid #d9b800}
.cl.r{border-left:4px solid var(--bad);background:#f6dada}
.cl.i{border-left:4px solid #6b7da8}
.cl.u{color:#27406f}
.cl.h{background:#c1ccea;font-weight:700}
.cl.f{color:#53607f}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.62);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding-inline:16px}
.sheet .panel{width:100%;max-width:560px;max-height:82%;overflow:auto;margin-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
textarea{width:100%;min-height:150px;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#0b1226;border:2px solid;border-color:var(--bev-d) var(--bev-l) var(--bev-l) var(--bev-d);padding:6px}
.stars{display:inline-block;width:60px;height:7px;background:#aeb9d3;border:1px solid #6d7ca2;vertical-align:middle}
.stars i{display:block;height:100%;background:var(--blue)}
.hero{padding:14px 10px;text-align:center;background:linear-gradient(#17387f,#0e2252);color:#fff;border:2px solid;border-color:#7da2ec #0a1a45 #0a1a45 #7da2ec;margin-bottom:10px}
.hero h1{margin:0;font:700 22px var(--f);letter-spacing:.14em;color:var(--gold)}
.hero p{margin:4px 0 0;color:#cfdcff}
.sub{color:#3c4a70;font-size:11px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.up{color:var(--good);font-size:9px;margin-left:1px}
.cl.t{border-left:4px solid var(--blue);color:#27406f}
ul.hl{margin:0;padding-left:18px;display:grid;gap:6px}
input[type=range]{accent-color:var(--blue);min-width:0;height:28px}
.bidbox{display:grid;gap:8px;margin-bottom:8px}
.hint{padding:6px 8px;border:1px solid var(--line);background:var(--ra);font-weight:700}
.hint.h0{color:var(--bad)}.hint.h1{color:var(--warn)}.hint.h2,.hint.h3{color:var(--good)}

</style>
</head>
<body>
<div id="app"><header id="hd"></header><main id="main"></main><nav id="nav"></nav></div>
<div class="sheet" id="sheet" data-act="sheetbg" hidden></div>

<script>
"use strict";
// ===== DATA =====
const AB=["Han","Tck","Pas","Cre","Sho","Hea","Pac","Sta"];
const ATTRS=["Handling","Tackling","Passing","Creativity","Shooting","Heading","Pace","Stamina"];
const HAN=0,TCK=1,PAS=2,CRE=3,SHO=4,HEA=5,PAC=6,STA=7;
const POSG={GK:'G',DL:'D',DC:'D',DR:'D',DM:'M',ML:'M',MC:'M',MR:'M',AM:'M',ST:'F'};
const GORD={G:0,D:1,M:2,F:3};
const FORMS={"4-4-2":[4,4,2],"4-3-3":[4,3,3],"3-5-2":[3,5,2],"4-5-1":[4,5,1],"5-3-2":[5,3,2],"3-4-3":[3,4,3]};
const MENT={D:"Defensive",N:"Normal",A:"Attacking"};
const rnd=Math.random;
const pick=(a,r)=>a[Math.floor((r||rnd)()*a.length)];
const cl=x=>Math.max(1,Math.min(20,Math.round(x)));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const nz=r=>(r()+r()+r()-1.5)*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const FIRST=["Adam","Aaron","Alfie","Andy","Ben","Billy","Callum","Cameron","Chris","Connor","Craig","Curtis","Dale","Daniel","Danny","Darren","Declan","Dominic","Elliot","Euan","Finn","Fraser","Gareth","Glenn","Harry","Hugh","Ian","Jack","Jake","Jamie","Jason","Jay","Joel","Jordan","Josh","Kai","Karl","Keith","Kieran","Kyle","Lee","Leon","Lewis","Liam","Luke","Marcus","Mark","Matt","Max","Mitchell","Nathan","Neil","Nick","Ollie","Owen","Paul","Reece","Rhys","Ricky","Rob","Ryan","Sam","Scott","Sean","Shane","Simon","Stuart","Tom","Tyler","Warren","Will","Zak","Luca","Mateo","Dieter","Jens","Pedro","Rui","Tomas","Andre","Marco","Yann","Niko","Stefan"];
const LAST=["Ainsley","Ashworth","Bagshaw","Barraclough","Birtles","Blenkinsop","Bracewell","Brindley","Calder","Cartmell","Chadwick","Clegg","Coulson","Crowther","Dacre","Dewhurst","Dunning","Eccles","Elphick","Farrimond","Fenton","Garside","Gaskell","Gledhill","Greenhalgh","Hadfield","Haslam","Heyes","Holroyd","Hulme","Isherwood","Jagger","Kettle","Kirkbride","Lambe","Latham","Lawton","Mallinson","Marsden","Metcalfe","Mottram","Naylor","Nuttall","Oldroyd","Openshaw","Pickles","Plumb","Priestley","Quayle","Radcliffe","Ramsbottom","Redfern","Rigby","Royle","Sagar","Shackleton","Sidebottom","Slater","Sugden","Tattersall","Thackray","Tinsley","Tomlinson","Turnbull","Uttley","Varley","Waddington","Wardle","Whitaker","Whittle","Wilcock","Winterbottom","Yates","Aldous","Cotterill","Dyson","Fairclough","Gill","Hartley","Ibbotson","Jowett","Kershaw","Lister","Mercer","Nixon","Ogden","Parkin","Rawlinson","Stansfield","Tordoff","Unsworth","Whalley","Yeomans","Ormerod","Pemberton","Quigley","Skerritt","Tolliver","Underhill","Wetherby","Yardley","Garrity","Kerrigan","Lockwood","Nesbitt","Moreau","Brandt","Kovac","Santos","Rossi","Hansen","Lindqvist","Duarte","Novak","Weiss"];

// [name, short, reputation 1-20, formation]
const CLUBS=[["Stonebridge Athletic","STO",17,"4-4-2"],["Thornfield Rovers","THO",15,"4-3-3"],["Wexmouth United","WEX",19,"4-3-3"],["Aldwick Town","ALD",8,"4-4-2"],["Carrowby City","CAR",16,"4-5-1"],["Dunmere Wanderers","DUN",11,"4-4-2"],["Eastholme Albion","EAS",9,"5-3-2"],["Fenwick Rangers","FEN",13,"4-4-2"],["Grimsworth Town","GRI",5,"5-3-2"],["Halbury Athletic","HAL",10,"3-5-2"],["Ironvale United","IRO",14,"4-4-2"],["Kingsmoor City","KIN",18,"4-3-3"],["Lowood Rovers","LOW",6,"4-5-1"],["Marlbeck Town","MAR",7,"4-4-2"],["Northcliffe Albion","NOR",12,"3-5-2"],["Oldhaven Wanderers","OLD",4,"5-3-2"],["Pennington City","PEN",13,"4-4-2"],["Ravensdale Town","RAV",9,"4-5-1"],["Southwick Rovers","SOU",11,"4-4-2"],["Westbrook United","WES",15,"4-3-3"]];
const SHAPE=[["GK",1],["GK",0],["DL",1],["DC",1],["DC",1],["DC",0],["DR",1],["DC",0],["ML",1],["MC",1],["MC",1],["MR",1],["DM",0],["AM",0],["MC",0],["ST",1],["ST",1],["ST",0],["ST",0],["ST",0]];
const PROFILE={G:[0,-8,-3,-7,-10,-4,-4,-2],D:[0,3,-1,-4,-6,3,0,1],M:[0,0,3,2,-1,-2,0,2],F:[0,-6,-1,0,4,1,2,0]};

function genAttrs(r,pos,q){
  const g=POSG[pos];
  return PROFILE[g].map((o,i)=>i===0?(g==='G'?cl(q+4+nz(r)*1.5):1+Math.floor(r()*3)):cl(q+o+nz(r)*1.8));
}
function clubBase(rep){return 6.5+rep*.38}
function buildDefaultDB(seed){
  const r=mulberry(seed),used=new Set();
  const clubs=CLUBS.map(([name,short,rep,formation])=>{
    const base=clubBase(rep);
    const players=SHAPE.map(([pos,st])=>{
      const q=base+(st?.8:-1.8)+nz(r)*1.2;
      let n;do{n=pick(FIRST,r)+" "+pick(LAST,r)}while(used.has(n));used.add(n);
      return{n,pos,age:18+Math.floor(r()*10+r()*8),a:genAttrs(r,pos,q)};
    });
    return{name,short,rep,formation,players};
  });
  return{clubs};
}
const startCash=rep=>Math.round((1.5+rep*.4)*1e6/5e4)*5e4;
function teamsFromDB(db){
  let nid=1;
  const teams=db.clubs.map((c,i)=>({id:i,name:c.name,short:c.short||c.name.slice(0,3).toUpperCase(),rep:c.rep||10,form:FORMS[c.formation]?c.formation:"4-4-2",
    ment:(c.rep||10)>=16?'A':(c.rep||10)<=5?'D':'N',cash:startCash(c.rep||10),xi:[],bench:[],
    pl:c.players.map(p=>({id:nid++,n:p.n,pos:p.pos,age:(p.age|0)||24,a:p.a.map(v=>cl(v)),cond:100,inj:0,sus:0,yc:0,g:0,ap:0,iw:-9,sw:-9}))}));
  return{teams,nid};
}
function dbFromTeams(teams){
  return{clubs:teams.map(t=>({name:t.name,short:t.short,rep:t.rep,formation:t.form,players:t.pl.map(p=>({n:p.n,pos:p.pos,age:p.age,a:p.a}))}))};
}
function validateDB(db){
  if(!db||!Array.isArray(db.clubs))return"Expected an object with a clubs array.";
  const n=db.clubs.length;
  if(n<4||n>24||n%2)return"Use an even number of clubs between 4 and 24.";
  for(const c of db.clubs){
    if(!c||typeof c.name!=="string"||!c.name.trim())return"Every club needs a name.";
    if(!Array.isArray(c.players)||c.players.length<14||c.players.length>40)return c.name+": needs 14 to 40 players.";
    let gk=0;
    for(const p of c.players){
      if(!p||typeof p.n!=="string"||!POSG[p.pos])return c.name+": a player has a missing name or an unknown position.";
      if(!Array.isArray(p.a)||p.a.length!==8||p.a.some(v=>typeof v!=="number"))return c.name+": "+p.n+" needs 8 numeric attributes.";
      if(POSG[p.pos]==='G')gk++;
    }
    if(!gk)return c.name+": needs at least one goalkeeper.";
  }
  return"";
}
function makeFixtures(n,r){
  const arr=[...Array(n).keys()],rounds=[];
  for(let k=0;k<n-1;k++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      let h=arr[i],a=arr[n-1-i];
      if(i===0?k%2===1:(k+i)%2===1)[h,a]=[a,h];
      pairs.push([h,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  for(let i=rounds.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rounds[i],rounds[j]]=[rounds[j],rounds[i]]}
  return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));
}

// ===== ENGINE =====
const att=p=>(2*p.a[SHO]+p.a[PAC]+p.a[CRE]+p.a[HEA])/5;
const mid=p=>(2*p.a[PAS]+p.a[CRE]+p.a[TCK]+p.a[STA])/5;
const dfn=p=>(2*p.a[TCK]+p.a[HEA]+p.a[PAC])/4;
function rateAs(p,g){
  if(g==='G')return p.a[HAN];
  const b=g==='D'?dfn(p)*.8+mid(p)*.2:g==='M'?mid(p)*.7+att(p)*.15+dfn(p)*.15:att(p)*.85+mid(p)*.15;
  return b*(POSG[p.pos]===g?1:.93);
}
const ovr=p=>rateAs(p,POSG[p.pos]);
function value(p){
  const o=ovr(p)-(POSG[p.pos]==='G'?3:0),a=p.age;
  let v=150000*Math.exp(.5*(o-8));
  v*=a<=21?1.4:a<=24?1.2:a<=28?1:a<=31?.7:a<=33?.4:.2;
  return Math.max(25000,Math.round(v/5000)*5000);
}
const fuzzy=p=>clamp(Math.round((ovr(p)-4+((p.id*37)%11-5)*.12)/2.6),1,5);
const ff=c=>.82+.18*c/100;
const fit=(p,slot)=>rateAs(p,slot)*ff(p.cond)+(POSG[p.pos]===slot?1.5:0);
const avail=p=>!(p.inj>0)&&!(p.sus>0);
const slotsOf=form=>{const[d,m,f]=FORMS[form];return['G',...Array(d).fill('D'),...Array(m).fill('M'),...Array(f).fill('F')]};

function bestXI(team,form){
  form=form||team.form;
  const slots=slotsOf(form),xi=Array(11).fill(null),used=new Set();
  let pool=team.pl.filter(avail);
  if(pool.length<12)pool=team.pl.slice();
  const idx=g=>slots.map((s,i)=>s===g?i:-1).filter(i=>i>=0);
  for(const i of[0,...idx('F'),...idx('D'),...idx('M')]){
    let best=null,bs=-1;
    for(const p of pool){if(used.has(p.id))continue;const s=fit(p,slots[i]);if(s>bs){bs=s;best=p}}
    xi[i]=best.id;used.add(best.id);
  }
  return xi;
}
function pickBench(team,xi){
  xi=xi||team.xi;
  let pool=team.pl.filter(p=>avail(p)&&!xi.includes(p.id));
  const gks=pool.filter(p=>POSG[p.pos]==='G').sort((a,b)=>b.a[HAN]-a.a[HAN]);
  const out=[];
  if(gks.length){out.push(gks[0].id);pool=pool.filter(p=>p!==gks[0])}
  pool.sort((a,b)=>ovr(b)-ovr(a));
  for(const p of pool){if(out.length>=5)break;out.push(p.id)}
  return out;
}
function autoPick(team,form){
  if(form)team.form=form;
  team.xi=bestXI(team);
  team.bench=pickBench(team);
}
function validateXI(team){
  const by=id=>team.pl.find(p=>p.id===id);
  if(team.xi.length!==11||team.xi.some(id=>!by(id))){autoPick(team);return true}
  const slots=slotsOf(team.form),used=new Set();
  let xi=team.xi.map(id=>{const p=by(id);if(avail(p)&&!used.has(id)){used.add(id);return id}return null});
  let changed=false;
  xi=xi.map((id,i)=>{
    if(id!==null)return id;
    changed=true;
    let best=null,bs=-1;
    for(const p of team.pl){if(!avail(p)||used.has(p.id))continue;const s=fit(p,slots[i]);if(s>bs){bs=s;best=p}}
    if(!best)best=team.pl.find(p=>!used.has(p.id));
    used.add(best.id);return best.id;
  });
  team.xi=xi;team.bench=pickBench(team);
  return changed;
}
function strength(side,home){
  const[nD,nM,nF]=FORMS[side.form];
  let A=0,D=0,M=0;
  for(const x of side.on){
    const p=x.p,f=ff(x.cond),k=f*((x.slot==='G'||POSG[p.pos]===x.slot)?1:.93);
    if(x.slot==='G')D+=1.4*p.a[HAN]*(.9+.1*f);
    else if(x.slot==='D'){D+=dfn(p)*k;M+=.4*mid(p)*k}
    else if(x.slot==='M'){A+=.45*att(p)*k;D+=.45*dfn(p)*k;M+=mid(p)*k}
    else{A+=att(p)*k;M+=.4*mid(p)*k}
  }
  A/=nF+.45*nM;D/=nD+.45*nM+1.4;M/=nM+.4*nF+.4*nD;
  const mod={D:[.9,1.07,.98],N:[1,1,1],A:[1.09,.93,1.02]}[side.ment]||[1,1,1];
  A*=mod[0];D*=mod[1];M*=mod[2];
  if(home){A*=1.06;M*=1.07}
  return{A,D,M};
}
function teamStr(team,xi,ment,home){
  const slots=slotsOf(team.form);

  return strength({on,form:team.form,ment:ment||team.ment},home);

const TXT={
  goal:["{n} finishes it off for {t}.","{n} sweeps the ball past {k}.","A cool finish from {n}.","{n} rises and heads it in!","{n} smashes it into the roof of the net.","{k} had no chance as {n} fires home."],
  save:["{n} drives a shot at goal but {k} saves.","{k} turns {n}'s effort round the post.","Good stop by {k} to deny {n}.","{n} tests {k}, who holds on comfortably."],
  miss:["{n} blazes the chance over the bar.","{n} drags a shot wide of the far post.","{n}'s effort drifts just wide.","{n} shoots from distance but it's well off target."],
  block:["{n}'s shot is charged down.","A last-ditch block stops {n}.","{n} hits it straight at a defender."],
  corner:["{n}'s effort is deflected behind for a corner."],
  flav:["{t} are keeping the ball well in midfield.","Plenty of effort in the middle of the park.","A scrappy spell with neither side in control.","{t} are pushing forward looking for an opening."]

const fill=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
function L(M,t,x,s){M.log.push({m:M.min,t,x,s})}

function mkSide(team,xi,bench,ai){
  const slots=slotsOf(team.form),by=id=>team.pl.find(p=>p.id===id);
  const used=new Map();
  const on=xi.map((id,i)=>{const p=by(id);used.set(p,'s');return{p,slot:slots[i],yc:0,cond:p.cond}});
  return{team,form:team.form,ment:team.ment,ai,on,bench:bench.map(by),subsUsed:0,pend:[],used,st:{att:0,sh:0,sot:0,co:0,yc:0,rc:0}};

function startMatch(hT,aT,week,userIdx){
  const M={s:[mkSide(hT,hT.xi,hT.bench,userIdx!==0),mkSide(aT,aT.xi,aT.bench,userIdx!==1)],min:0,score:[0,0],log:[],goals:[],week,done:false,htDone:false,pre:false,str:null};

function recalc(M){M.str=[strength(M.s[0],true),strength(M.s[1],false)]}
function bestSub(s,slot){
  let best=null,bs=-1;

    if(!avail(p))continue;
    if(slot==='G'&&POSG[p.pos]!=='G')continue;
    const v=rateAs(p,slot)*ff(p.cond)+(POSG[p.pos]===slot?1.5:0);
    if(v>bs){bs=v;best=p}
  }

}
function doSub(M,i,x,b,forced){
  const s=M.s[i],k=s.on.indexOf(x);
  const slot=(!hasGK(s)&&POSG[b.pos]==='G'&&x.slot!=='G')?'G':x.slot;
  s.on[k]={p:b,slot,yc:0,cond:b.cond};
  s.bench=s.bench.filter(p=>p!==b);
  s.subsUsed++;
  if(!s.used.has(b))s.used.set(b,'b');
  L(M,'u',"Substitution for "+s.team.short+": "+b.n+" replaces "+x.p.n+(forced?" (injury).":"."),i);
  recalc(M);
}
function subIn(M,i,b,slot){
  const s=M.s[i];
  s.on.push({p:b,slot,yc:0,cond:b.cond});
  s.on.sort((p,q)=>GORD[p.slot]-GORD[q.slot]);
  s.bench=s.bench.filter(p=>p!==b);s.subsUsed++;
  if(!s.used.has(b))s.used.set(b,'b');
  L(M,'u',"Substitution for "+s.team.short+": "+b.n+" comes on"+({G:" in goal",D:" in defence",M:" in midfield",F:" in attack"}[slot]||"")+".",i);
  recalc(M);
}
function autoFill(M,i){
  const s=M.s[i];
  while(s.pend&&s.pend.length){
    const e=s.pend.shift();
    if(e.slot==='G')continue;
    if(s.subsUsed<3){const b=bestSub(s,e.slot);if(b)subIn(M,i,b,e.slot)}

}
const hasGK=s=>s.on.some(x=>x.slot==='G');
function pickW(arr,w){
  let t=0;const ws=arr.map(x=>{const v=w(x);t+=v;return v});
  let u=rnd()*t;
  for(let k=0;k<arr.length;k++){if(u<ws[k])return arr[k];u-=ws[k]}
  return arr[arr.length-1];
}
function flag(M,i,t){
  const s=M.s[i];
  if(s.ai||M.done)return;
  const extra=hasGK(s)?'':' You have no goalkeeper. Put someone in goal, or press Play and the game will choose for you.';
  M.inc=M.inc?{i,t:M.inc.t.replace(/ You have no goalkeeper.*$/,'')+' '+t+extra}:{i,t:t+extra};
}
function fixKeeper(M,i){
  const s=M.s[i];
  if(!s.on.length||hasGK(s))return false;
  if(s.subsUsed<3){
    const b=bestSub(s,'G');
    if(b){
      const x=s.on.slice().sort((p,q)=>rateAs(p.p,p.slot)*ff(p.cond)-rateAs(q.p,q.slot)*ff(q.cond))[0],k=s.on.indexOf(x);
      s.on[k]={p:b,slot:'G',yc:0,cond:b.cond};
      s.bench=s.bench.filter(p=>p!==b);s.subsUsed++;
      if(!s.used.has(b))s.used.set(b,'b');
      L(M,'u',"Substitution for "+s.team.short+": goalkeeper "+b.n+" replaces "+x.p.n+".",i);
      recalc(M);return true;
    }
  }
  const x=s.on.slice().sort((p,q)=>q.p.a[HAN]-p.p.a[HAN])[0];
  x.slot='G';
  L(M,'u',x.p.n+" ("+s.team.short+") takes over in goal.",i);
  recalc(M);return true;
}
function sendOff(M,i,x){const s=M.s[i];s.on=s.on.filter(y=>y!==x);s.st.rc++;recalc(M);if(s.ai)fixKeeper(M,i)}
function changeForm(M,i,form){
  const s=M.s[i];
  if(!FORMS[form]||s.form===form)return;
  const slots=slotsOf(form),n=s.on.length;
  while(slots.length>n){
    const cnt=g=>slots.filter(x=>x===g).length,g=cnt('F')>1?'F':cnt('M')>2?'M':'D';
    slots.splice(slots.lastIndexOf(g),1);
  }
  const pool=s.on.slice(),out=[];
  const idx=g=>slots.map((x,k)=>x===g?k:-1).filter(k=>k>=0);
  for(const k of[...idx('G'),...idx('F'),...idx('D'),...idx('M')]){
    let best=null,bs=-1;
    for(const x of pool){const v=fit(x.p,slots[k]);if(v>bs){bs=v;best=x}}
    pool.splice(pool.indexOf(best),1);
    out[k]={p:best.p,slot:slots[k],yc:best.yc,cond:best.cond};
  }
  s.on=out.filter(Boolean);s.form=form;
  L(M,'t',"Tactical change: "+s.team.short+" switch to "+form+".",i);
  recalc(M);
}
function cardEvent(M,i){
  const s=M.s[i],fresh=s.on.filter(y=>y.yc===0),x=pickW(fresh.length&&rnd()<.88?fresh:s.on,y=>y.slot==='G'?.2:1),p=x.p;
  if(rnd()<.02){
    L(M,'r',"RED CARD! "+p.n+" ("+s.team.short+") is sent off for a reckless tackle.",i);
    p.sus=1+(rnd()<.35?1:0)+(rnd()<.1?1:0);p.sw=M.week;sendOff(M,i,x);flag(M,i,"RED CARD: "+p.n+" is sent off. Change formation or make a substitution, or press Play to carry on a man short.");return;
  }
  x.yc++;p.yc++;s.st.yc++;
  if(x.yc>=2){
    L(M,'r',"RED CARD! "+p.n+" ("+s.team.short+") is sent off after a second booking.",i);
    p.sus=Math.max(p.sus,1);p.sw=M.week;sendOff(M,i,x);flag(M,i,"RED CARD: "+p.n+" is sent off. Change formation or make a substitution, or press Play to carry on a man short.");
  }else{
    L(M,'y',p.n+" ("+s.team.short+") is booked.",i);
    if(p.yc%5===0){p.sus=1;p.sw=M.week}
  }
}
function injuryEvent(M,i){
  const s=M.s[i],x=pickW(s.on,y=>y.slot==='G'?.25:1),p=x.p;
  p.inj=pick([1,1,2,2,3,4,6,8]);p.iw=M.week;
  L(M,'i',p.n+" ("+s.team.short+") goes down injured and cannot continue.",i);
  if(!s.ai){
    s.on=s.on.filter(y=>y!==x);recalc(M);
    const left=3-s.subsUsed;
    if(left>0&&s.bench.some(avail)){
      (s.pend=s.pend||[]).push({slot:x.slot,n:p.n});
      flag(M,i,p.n+" ("+p.pos+") is injured. Tap a substitute to bring him on, or press Play and the game picks the best one. Substitutions left: "+left+".");
    }else flag(M,i,p.n+" ("+p.pos+") is injured and you have no substitutes left, so you are a man short. You can change the formation.");
    return;
  }
  const b=s.subsUsed<3?bestSub(s,x.slot):null;
  if(b)doSub(M,i,x,b,true);else{s.on=s.on.filter(y=>y!==x);recalc(M);fixKeeper(M,i)}
}
function aiManage(M,i){
  const s=M.s[i],m=M.min;
  if((m===58||m===68||m===77)&&s.subsUsed<3){
    const c=s.on.filter(x=>x.slot!=='G').sort((a,b)=>a.cond-b.cond)[0];
    if(c){const b=bestSub(s,c.slot);if(b&&rateAs(b,c.slot)*ff(b.cond)>rateAs(c.p,c.slot)*ff(c.cond)-1.5)doSub(M,i,c,b,false)}
  }
  if(m===75){const my=M.score[i],th=M.score[1-i];if(my<th)s.ment='A';else if(my>th)s.ment='D';recalc(M)}
}
function doShot(M,ai){
  const A=M.s[ai],D=M.s[1-ai];
  if(!A.on.length)return;
  const w=A.on.map(x=>(x.slot==='F'?5:x.slot==='M'?1.6:x.slot==='D'?.45:.02)*(x.p.a[SHO]+2)/12);
  let u=rnd()*w.reduce((a,b)=>a+b,0),k=0;
  for(;k<w.length-1;k++){if(u<w[k])break;u-=w[k]}
  const sx=A.on[k],sp=sx.p,gx=D.on.find(x=>x.slot==='G'),gk=gx?gx.p:null;
  const sh=sp.a[SHO]*ff(sx.cond),h=gk?gk.a[HAN]:0;
  const conv=gk?clamp(.135+.005*(sh-11)-.005*(h-11),.04,.30):.55;
  const o={n:sp.n,t:A.team.short,k:gk?gk.n:"the empty goal"};
  A.st.sh++;
  if(rnd()<conv){
    A.st.sot++;M.score[ai]++;sp.g++;M.goals.push([M.min,sp.n,ai]);
    L(M,'g',"GOAL! "+fill(pick(TXT.goal),o)+"  "+M.s[0].team.short+" "+M.score[0]+"-"+M.score[1]+" "+M.s[1].team.short,ai);
    return;
  }
  const v=rnd();
  if(v<.33){A.st.sot++;L(M,'s',fill(pick(TXT.save),o),ai)}
  else if(v<.62)L(M,'s',fill(pick(TXT.miss),o),ai);
  else if(v<.85)L(M,'s',fill(pick(TXT.block),o),ai);
  else{A.st.co++;L(M,'s',fill(pick(TXT.corner),o),ai)}
}
function stepMin(M){
  if(M.done)return;
  const m=++M.min,S=M.s;
  for(let i=0;i<2;i++)if(S[i].pend&&S[i].pend.length)autoFill(M,i);
  for(let i=0;i<2;i++)if(S[i].on.length&&!hasGK(S[i]))fixKeeper(M,i);
  for(let i=0;i<2;i++)for(const x of S[i].on)x.cond-=Math.max(.03,.16-.006*x.p.a[STA])*(x.slot==='G'?.25:1);
  for(let i=0;i<2;i++)if(S[i].ai)aiManage(M,i);
  for(let i=0;i<2;i++){
    if(S[i].on.length&&rnd()<.017)cardEvent(M,i);
    if(S[i].on.length&&rnd()<.0012)injuryEvent(M,i);
  }
  recalc(M);
  let ev=false;
  if(rnd()<.42){
    const a=M.str[0],b=M.str[1],ai=rnd()<a.M/(a.M+b.M)?0:1;
    S[ai].st.att++;
    const q=clamp(.54+.02*(M.str[ai].A-M.str[1-ai].D),.25,.8);
    if(rnd()<q){doShot(M,ai);ev=true}
  }
  if(!ev&&rnd()<.03){const i=rnd()<.5?0:1;L(M,'f',fill(pick(TXT.flav),{t:S[i].team.name}),i)}
  if(m===45)L(M,'h',"Half time: "+S[0].team.name+" "+M.score[0]+"-"+M.score[1]+" "+S[1].team.name,-1);
  if(m>=90){M.done=true;L(M,'h',"Full time: "+S[0].team.name+" "+M.score[0]+"-"+M.score[1]+" "+S[1].team.name,-1)}
}

let G=null;

function fxOf(w,i){return G.fx[w].find(([h,a])=>h===i||a===i)}
function resOf(w,h,a){return(G.res[w]||[]).find(r=>r.h===h&&r.a===a)}
function commitMatch(M){
  const w=M.week,r={h:M.s[0].team.id,a:M.s[1].team.id,hg:M.score[0],ag:M.score[1],sc:M.goals.slice()};
  (G.res[w]=G.res[w]||[]).push(r);
  for(const s of M.s)s.used.forEach((how,p)=>{
    p.ap++;
    const gf=POSG[p.pos]==='G'?.3:1;
    p.cond=Math.max(30,p.cond-gf*(how==='s'?24-p.a[STA]*.6:12-p.a[STA]*.3));
  });
  return r;
}
function prepWeek(w,userIdx){

}

  for(const[h,a]of G.fx[w]){
    if(h===userIdx||a===userIdx)continue;

function endWeek(w){
  const me=T(G.club);
  for(const p of me.pl){
    if(p.iw===w&&p.inj>0)addNews(p.n+" is injured and will miss "+p.inj+(p.inj>1?" matches.":" match."));
    if(p.sw===w&&p.sus>0)addNews(p.n+" is suspended for "+p.sus+(p.sus>1?" matches.":" match."));
  }
  for(const t of G.teams)for(const p of t.pl){
    if(p.inj>0&&p.iw!==w){p.inj--;if(p.inj===0&&t===me)addNews(p.n+" is fit again.")}
    if(p.sus>0&&p.sw!==w)p.sus--;

}
function table(){
  const t=G.teams.map((x,i)=>({i,p:0,w:0,d:0,l:0,f:0,a:0,pts:0,form:[]}));
  G.res.forEach(wk=>{if(!wk)return;wk.forEach(r=>{
    const h=t[r.h],a=t[r.a];h.p++;a.p++;h.f+=r.hg;h.a+=r.ag;a.f+=r.ag;a.a+=r.hg;
    if(r.hg>r.ag){h.w++;a.l++;h.pts+=3;h.form.push('W');a.form.push('L')}
    else if(r.hg<r.ag){a.w++;h.l++;a.pts+=3;a.form.push('W');h.form.push('L')}
    else{h.d++;a.d++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}
  })});
  return t.sort((x,y)=>y.pts-x.pts||(y.f-y.a)-(x.f-x.a)||y.f-x.f||G.teams[x.i].name.localeCompare(G.teams[y.i].name));
}

function newSeason(){
  G.year++;G.season++;G.week=0;G.res=[];

    const base=clubBase(t.rep),r=Math.random;

      p.age++;

        const q=base-1+nz(r)*1.2;
        return{id:G.nid++,n:p.n.split(" ")[0]+" "+pick(LAST),pos:p.pos,age:17+Math.floor(r()*3),a:genAttrs(r,p.pos,q),cond:100,inj:0,sus:0,yc:0,g:0,ap:0,iw:-9,sw:-9};
      }
      p.a=p.a.map((v,i)=>{
        if(i===HAN&&POSG[p.pos]!=='G')return v;
        let d=0;const u=r();
        if(p.age<=23)d=u<.45?1:u<.55?-1:0;

// ===== CLUB: money, staff, training, scouting, transfers =====
const ROLES=['G','D','M','F'];
const RNAME={G:'Goalkeeping',D:'Defence',M:'Midfield',F:'Attack'};

const money=v=>(v<0?'-':'')+(Math.abs(v)>=1e6?'£'+(Math.abs(v)/1e6).toFixed(2)+'m':'£'+Math.round(Math.abs(v)/1000)+'k');
const income=t=>60000+t.rep*10000;
const myTeam=()=>G.teams[G.club];

const wages=()=>ROLES.reduce((s,r)=>s+(G.staff.coach[r]?G.staff.coach[r].wage:0),0)+G.staff.scouts.reduce((s,c)=>s+c.wage,0);

function genStaff(kind){

}
function genPool(){return{G:[0,0,0].map(()=>genStaff('C')),D:[0,0,0].map(()=>genStaff('C')),M:[0,0,0].map(()=>genStaff('C')),F:[0,0,0].map(()=>genStaff('C')),S:[0,0,0].map(()=>genStaff('S'))}}
function initClub(g){
  g.uid=g.uid||1;
  g.train=g.train||{G:{k:HAN,i:'N'},D:{k:TCK,i:'N'},M:{k:PAS,i:'N'},F:{k:SHO,i:'N'}};

// ----- training -----
function trainWeek(w){
  const t=myTeam(),ups=[];
  for(const p of t.pl){
    if(p.inj>0)continue;
    const g=POSG[p.pos],tr=G.train[g],it=INT[tr.i],co=G.staff.coach[g],cf=.5+.25*(co?co.lvl:0);
    p.tp=p.tp||Array(8).fill(0);
    const af=p.age<=21?1.5:p.age<=24?1.2:p.age<=28?.8:p.age<=31?.4:p.age<=34?.1:.03;
    const gain=(k,rate)=>{
      if(p.a[k]>=20){p.tp[k]=0;return}
      p.tp[k]+=rate*af*cf*(clamp((20-p.a[k])/12,.1,1.2));
      while(p.tp[k]>=1&&p.a[k]<20){p.a[k]++;p.tp[k]-=1;ups.push(p.n+" ("+ATTRS[k]+") is now "+p.a[k]+".")}
      p.tp[k]=Math.round(p.tp[k]*1000)/1000;
    };
    gain(tr.k,.05*it.g);
    if(co)for(const k of PASSIVE[g])if(k!==tr.k)gain(k,.016);
    p.cond=clamp(p.cond+(it.c<0&&g==='G'?it.c*.3:it.c),30,100);
    if(it.i&&Math.random()<it.i*(g==='G'?.25:1)){p.inj=1+Math.floor(Math.random()*3);p.iw=w;ups.push(p.n+" picks up a training injury ("+p.inj+(p.inj>1?" matches":" match")+").")}
  }
  ups.slice(0,4).forEach(addNews);
  if(ups.length>4)addNews((ups.length-4)+" more training updates this week.");
  G.trend.push(Math.round(t.pl.reduce((s,p)=>s+ovr(p),0)/t.pl.length*100)/100);
  if(G.trend.length>60)G.trend.shift();
}

// ----- scouting -----
function scoutWeek(w){
  for(const sc of G.staff.scouts){
    for(let c=0;c<(sc.lvl>=4?2:1);c++){
      const pool=[];
      for(const t of G.teams){if(t.id===G.club)continue;for(const p of t.pl){if(G.rep[p.id])continue;if(sc.focus!=='A'&&POSG[p.pos]!==sc.focus)continue;pool.push(p)}}
      if(!pool.length)continue;
      pool.sort((a,b)=>ovr(b)-ovr(a));
      const top=Math.max(5,Math.floor(pool.length*(.6-.1*sc.lvl))),p=pool[Math.floor(Math.random()*Math.min(top,pool.length))];
      const sig=(6-sc.lvl)*.6,t=G.teams.find(x=>x.pl.includes(p));
      G.rep[p.id]={a:p.a.map(v=>cl(v+nz(Math.random)*sig)),w,l:sc.lvl};
      addNews(sc.name+" reports on "+p.n+" ("+t.short+", "+p.pos+", age "+p.age+").");
    }
  }
}

// ----- transfers -----
function newPlayer(team,pos,age,q){
  const names=new Set(G.teams.flatMap(t=>t.pl.map(p=>p.n)));
  let n;do{n=pick(FIRST)+" "+pick(LAST)}while(names.has(n));
  return{id:G.nid++,n,pos,age,a:genAttrs(Math.random,pos,q),cond:100,inj:0,sus:0,yc:0,g:0,ap:0,iw:-9,sw:-9};
}
function fillGroups(t){
  const POS={G:['GK'],D:['DL','DC','DC','DR'],M:['ML','MC','MC','MR','DM','AM'],F:['ST']};
  for(const g of ROLES)while(count(t,g)<MINC[g])t.pl.push(newPlayer(t,pick(POS[g]),18+Math.floor(Math.random()*8),clubBase(t.rep)-.5+nz(Math.random)));
}
function moveTo(p,from,to){
  from.pl=from.pl.filter(x=>x!==p);to.pl.push(p);p.ls=0;
  fillGroups(from);
  if(from.id===G.club)validateXI(from);else autoPick(from);
  if(to.id===G.club){p.a0=p.a.slice();p.tp=Array(8).fill(0);delete G.rep[p.id]}
  else autoPick(to);
}
function placeBid(pid,fee){
  const p=pById(pid),t=p&&G.teams.find(x=>x.pl.includes(p));
  if(!p||t.id===G.club)return'That player is not available.';
  if(G.bids.some(b=>b.pid===pid))return'You already have a bid for this player.';
  if(G.bids.length>=5)return'You can have five bids at a time.';
  if(myTeam().pl.length>=30)return'Your squad is full (30 players).';
  if(fee>myTeam().cash)return'You cannot afford that fee.';
  G.bids.push({id:G.uid++,pid,fee,w:G.week});
  return'';
}
function withdrawBid(id){G.bids=G.bids.filter(b=>b.id!==id)}
function bidChance(p,fee){
  const U=myTeam(),S=G.teams.find(x=>x.pl.includes(p));
  if(!S||S.id===G.club)return{p:0,why:''};
  const v=value(p),r=fee/v,g=POSG[p.pos];
  let pr=clamp((r-.8)/.4,0,1),why='';
  if(S.pl.slice().sort((x,y)=>ovr(y)-ovr(x)).slice(0,3).includes(p)&&r<1.2)pr*=.25;
  const diff=S.rep-U.rep;
  pr*=clamp((diff>8?.45:diff>4?.75:1)+(r-1)*.8,0,1);
  if(count(S,g)<=MINC[g]&&r<1.6){if(r>=.8)why='group';pr=0}
  return{p:pr,why};
}
function resolveBids(){
  const U=myTeam();
  for(const b of G.bids){
    const p=pById(b.pid),S=p&&G.teams.find(x=>x.pl.includes(p));
    if(!p||S.id===G.club)continue;
    if(b.fee>U.cash){addNews("Your bid for "+p.n+" failed: not enough money.");continue}
    if(U.pl.length>=30){addNews("Your bid for "+p.n+" failed: squad full.");continue}
    const pr=bidChance(p,b.fee).p;
    if(Math.random()<pr){
      U.cash-=b.fee;S.cash+=b.fee;moveTo(p,S,U);
      addNews("Transfer complete: "+p.n+" joins from "+S.name+" for "+money(b.fee)+".");
    }else addNews(S.name+" rejected your "+money(b.fee)+" bid for "+p.n+".");
  }
  G.bids=[];
}
function toggleList(pid){
  const p=pById(pid);if(!p)return;
  p.ls=p.ls?0:1;
  if(!p.ls)G.offers=G.offers.filter(o=>o.pid!==pid);
}
function weeklyOffers(w){
  const U=myTeam();
  G.offers=G.offers.filter(o=>o.exp>w&&U.pl.some(p=>p.id===o.pid));
  for(const p of U.pl){
    if(!p.ls||G.offers.some(o=>o.pid===p.id)||Math.random()>.45)continue;
    const fee=Math.round(value(p)*(.8+Math.random()*.5)/5000)*5000;
    const buyers=G.teams.filter(t=>t.id!==G.club&&t.pl.length<26&&t.cash>=fee).sort(()=>Math.random()-.5);
    if(!buyers.length)continue;
    G.offers.push({id:G.uid++,pid:p.id,club:buyers[0].id,fee,exp:w+2});
    addNews(buyers[0].name+" offer "+money(fee)+" for "+p.n+".");
  }
}
function acceptOffer(id){
  const o=G.offers.find(x=>x.id===id),U=myTeam();
  if(!o)return'';
  const p=pById(o.pid),B=T(o.club);
  if(!p||!U.pl.includes(p)){G.offers=G.offers.filter(x=>x!==o);return'That player has already left.'}
  if(U.pl.length<=16)return'You need at least 16 players in your squad.';
  if(POSG[p.pos]==='G'&&count(U,'G')<=2)return'You need at least two goalkeepers.';
  if(B.cash<o.fee)return'That club can no longer afford the fee.';
  U.cash+=o.fee;B.cash-=o.fee;moveTo(p,U,B);
  G.offers=G.offers.filter(x=>x.pid!==p.id);
  addNews("Sold: "+p.n+" joins "+B.name+" for "+money(o.fee)+".");
  return'';
}
function rejectOffer(id){G.offers=G.offers.filter(o=>o.id!==id)}

function pickSheet(i){

    list.map(p=>{const j=t.xi.indexOf(p.id),ok=avail(p);return'<tr'+(ok?' data-act="place" data-id="'+p.id+'"':'')+' class="'+(p.id===cur?'me':ok?'':'un')+'"><td>'+p.pos+'</td><td class="nm">'+esc(p.n)+'</td><td class="n">'+Math.round(rateAs(p,slot))+'</td><td class="n">'+Math.round(p.cond)+'</td><td>'+(stat(p)||(j>=0?gname[slotsOf(t.form)[j]]:'Res'))+'</td></tr>'}).join('')+'</tbody></table></div><div class="pb"><button class="btn" data-act="closesheet">Cancel</button></div></div>';

function spark(v){
  if(v.length<2)return'<div class="sub">The chart appears after a couple of matchdays.</div>';
  const W=300,H=64,mn=Math.min(...v),mx=Math.max(...v),sp=Math.max(mx-mn,.2),x=i=>8+i*(W-16)/(v.length-1),y=a=>H-8-(a-mn)/sp*(H-16);
  const pts=v.map((a,i)=>x(i).toFixed(1)+','+y(a).toFixed(1)).join(' ');
  return'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Squad average rating over time"><rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#e8edf7"/><polyline points="'+pts+'" fill="none" stroke="#2350a8" stroke-width="2"/><circle cx="'+x(v.length-1).toFixed(1)+'" cy="'+y(v[v.length-1]).toFixed(1)+'" r="3.5" fill="#d19a00"/></svg><div class="sub">Squad average rating: '+v[0].toFixed(2)+' to '+v[v.length-1].toFixed(2)+' over '+v.length+' matchdays.</div>';
}

  for(const r of ROLES){
    const co=G.staff.coach[r],tr=G.train[r];
    h+='<div class="panel"><div class="ph"><span>'+RNAME[r]+'</span><span>'+(co?esc(co.name)+', level '+co.lvl:'No coach')+'</span></div><div class="pb"><div class="sub" style="margin-bottom:4px">Focus attribute</div><div class="seg">'+
      FOCUS[r].map(k=>'<button class="btn sm'+(tr.k===k?' on':'')+'" data-act="tfocus" data-g="'+r+'" data-k="'+k+'">'+ATTRS[k]+'</button>').join('')+'</div><div class="sub" style="margin-bottom:4px">Intensity</div><div class="seg" style="margin:0">'+
      Object.keys(INT).map(k=>'<button class="btn sm'+(tr.i===k?' on':'')+'" data-act="tint" data-g="'+r+'" data-v="'+k+'">'+INT[k].n+'</button>').join('')+'</div>'+(co?'<p class="sub" style="margin:6px 0 0">The coach also slowly improves '+PASSIVE[r].map(k=>ATTRS[k]).join(' and ')+'.</p>':'<p class="sub" style="margin:6px 0 0">Hire a coach on the Staff tab to speed this up and train the position basics.</p>')+'</div></div>';

  return h;

const mi=()=>M.s[0].ai?1:0;
function scoreHTML(){

function mUpdate(full){

function ctlHTML(){
  if(M.done)return'<button class="btn go" data-act="mend">Full time: view results</button>';

  const nm={s:'Slow',n:'Normal',f:'Fast'};
  return'<button class="btn go" data-act="mplay">'+(UI.mpaused?(M.min===45&&M.htDone?'Start 2nd half':'Play'):'Pause')+'</button>'+Object.keys(nm).map(k=>'<button class="btn sm'+(UI.speed===k?' on':'')+'" data-act="mspeed" data-v="'+k+'">'+nm[k]+'</button>').join('')+'<button class="btn sm" data-act="mtab" data-v="team">Tactics</button><button class="btn sm" data-act="mskip">Skip to end</button>';

function mCtl(){$('#nav').innerHTML=ctlHTML()}
function incident(){
  clearTimeout(UI.mt);
  UI.mpaused=true;UI.mtab='team';UI.msel=-1;UI.msg=M.inc.t;M.inc=null;
  render();
}
function mTick(){
  clearTimeout(UI.mt);
  if(!M||M.pre||M.done||UI.mpaused)return;
  UI.mt=setTimeout(()=>{
    if(!M)return;
    stepMin(M);
    if(M.inc){if(M.done)M.inc=null;else{incident();return}}
    if(M.min===45&&!M.htDone){M.htDone=true;UI.mpaused=true}
    mUpdate(false);
    if(M.done||UI.mpaused)mCtl();else mTick();
  },SP[UI.speed]);
}
function startMatchDay(){
  const w=G.week,t=me(),changed=validateXI(t);
  for(const x of G.teams)if(x.id!==G.club)autoPick(x);
  const[h]=fxOf(w,G.club);
  M=startMatch(T(fxOf(w,G.club)[0]),T(fxOf(w,G.club)[1]),w,h===G.club?0:1);
  M.pre=true;UI.screen='match';UI.mtab='comm';UI.mpaused=true;UI.msel=-1;
  UI.msg=changed?'Some selected players were unavailable, so replacements were picked.':'';
  render();
}
function finishUser(){
  clearTimeout(UI.mt);
  const w=G.week,r=commitMatch(M),home=r.h===G.club,g=home?r.hg:r.ag,o=home?r.ag:r.hg;
  addNews((g>o?'Win: ':g<o?'Defeat: ':'Draw: ')+T(r.h).name+' '+r.hg+'-'+r.ag+' '+T(r.a).name+'.');
  playOthers(w,G.club);
  endWeek(w);
  clubWeek(w);
  G.week++;
  if(validateXI(me()))addNews('Your team selection was updated because of injuries or suspensions.');
  M=null;UI.screen='results';UI.res=w;UI.msg='';
  save();render();
}

  return'<div class="panel"><div class="ph"><span>Matchday '+(w+1)+' results</span><span>'+fmtD(dateOf(w))+'</span></div><div class="tw"><table><tbody>'+

    '<div class="pb"><b>You are '+ord(pos)+' with '+tb[pos-1].pts+' points.</b></div></div>'+
    (G.week>=WK()?'<div class="note">That was the final matchday. Press Home for the season summary.</div>':'');

function validSave(g){
  try{
    return!!(g&&g.v===1&&typeof g.club==='number'&&Array.isArray(g.teams)&&g.teams.length>=4&&g.teams[g.club]&&Array.isArray(g.fx)&&g.fx.length===(g.teams.length-1)*2&&Array.isArray(g.res)&&typeof g.week==='number'&&
      g.teams.every(t=>t&&Array.isArray(t.pl)&&t.pl.length>=11&&Array.isArray(t.xi)&&t.pl.every(p=>p&&Array.isArray(p.a)&&p.a.length===8&&POSG[p.pos])));
  }catch(e){return false}
}

// ----- actions -----
function act(a,d,ev){
  switch(a){
    case'nav':UI.screen=d.v;UI.msg='';UI.sheet=null;UI.expo='';if(d.v==='league')UI.fw=Math.min(G.week,WK()-1);render();break;
    case'cont':
      UI.msg='';UI.sheet=null;
      if(UI.screen==='results'||G.week>=WK()){UI.screen='home';render()}
      else startMatchDay();
      break;
    case'seg':UI.seg[d.k]=d.v;render();break;
    case'player':UI.sheet={t:'player',id:+d.id};renderSheet();break;
    case'closesheet':UI.sheet=null;renderSheet();break;
    case'sheetbg':if(ev.target===ev.currentTarget){UI.sheet=null;renderSheet()}break;
    case'form':autoPick(me(),d.v);save();render();break;
    case'ment':me().ment=d.v;save();render();break;
    case'auto':autoPick(me());save();render();break;
    case'slot':UI.sheet={t:'pick',i:+d.i};renderSheet();break;
    case'place':{
      const t=me(),i=UI.sheet.i,id=+d.id,j=t.xi.indexOf(id);
      if(j>=0)[t.xi[i],t.xi[j]]=[t.xi[j],t.xi[i]];else t.xi[i]=id;
      t.bench=pickBench(t);UI.sheet=null;save();render();break;
    }
    case'fw':UI.fw=Math.max(0,Math.min(WK()-1,UI.fw+ +d.v));render();break;
    case'club':UI.setup.sel=+d.i;render();break;
    case'start':newGame(UI.setup.db,UI.setup.sel);UI.screen='home';UI.msg='';UI.save=null;save();render();break;
    case'resume':G=UI.save;initClub(G);UI.save=null;UI.screen='home';render();break;
    case'usedef':UI.setup={db:DEF,sel:null};UI.msg='';render();break;
    case'import':case'import2':{
      let db=null,err='';
      try{db=JSON.parse($('#imp').value)}catch(e){err='That is not valid JSON.'}
      if(db&&!err)err=validateDB(db);
      if(err){UI.msg=err;render();break}
      UI.setup={db,sel:null};if(G)UI.save=G;UI.msg='Database loaded. Choose a club to start a new game.';UI.screen='title';render();break;
    }
    case'export':UI.expo=dbJSON(dbFromTeams(G.teams));render();break;
    case'copy':{
      const ta=$('#'+(d.t||'exp'));if(!ta)break;
      ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
      try{navigator.clipboard.writeText(ta.value).catch(()=>{})}catch(e){}
      break;
    }
    case'newgame':
      if(!UI.armed){UI.armed=true;render();setTimeout(()=>{UI.armed=false;if(UI.screen==='club')render()},4000);break}
      UI.armed=false;UI.save=G;UI.setup={db:DEF,sel:null};UI.msg='';UI.screen='title';render();break;
    case'nseason':newSeason();save();render();break;
    case'mtab':
      UI.mtab=d.v;
      if(d.v==='team'&&!M.pre&&!M.done){UI.mpaused=true;clearTimeout(UI.mt)}
      render();break;
    case'mback':M=null;UI.screen='tactics';UI.msg='';render();break;
    case'mkick':M.pre=false;L(M,'h','Kick-off: '+M.s[0].team.name+' v '+M.s[1].team.name+'.',-1);UI.mpaused=false;UI.mtab='comm';render();mTick();break;
    case'mplay':
      if(UI.mpaused){UI.mpaused=false;UI.msg='';UI.msel=-1;if(UI.mtab==='team')UI.mtab='comm';render();mTick()}
      else{UI.mpaused=true;clearTimeout(UI.mt);mCtl()}
      break;
    case'mspeed':UI.speed=d.v;mCtl();break;
    case'mskip':
      clearTimeout(UI.mt);
      while(!M.done){stepMin(M);if(M.inc)break}
      if(M.inc){if(M.done)M.inc=null;else{incident();break}}
      if(M.min>=45)M.htDone=true;
      UI.mpaused=true;UI.msel=-1;render();break;
    case'mgoal':{const s=M.s[mi()],x=s.on[UI.msel];if(x&&!hasGK(s)){x.slot='G';L(M,'u',x.p.n+' ('+s.team.short+') takes over in goal.',mi());recalc(M)}UI.msel=-1;UI.msg='';render();break}
    case'mauto':fixKeeper(M,mi());UI.msel=-1;UI.msg='';render();break;
    case'minj':{const s=M.s[mi()],b=s.bench[+d.i];if(b&&s.subsUsed<3){const slot=!hasGK(s)?'G':POSG[b.pos];subIn(M,mi(),b,slot);if(s.pend&&s.pend.length){const k=s.pend.findIndex(e=>e.slot===slot);s.pend.splice(k<0?0:k,1)}UI.msel=-1}UI.msg=s.pend&&s.pend.length?'Another player needs replacing.':'';render();break}
    case'mshort':{M.s[mi()].pend=[];UI.msg='';render();break}
    case'tf':UI.tf=d.v;UI.mkp=0;render();break;
    case'mkmore':UI.mkp++;render();break;
    case'bid':{const e=placeBid(+d.pid,+d.fee);UI.msg=e||'Bid placed. You will hear back after the next matchday.';UI.sheet=null;if(!e)save();render();break}
    case'unbid':withdrawBid(+d.id);save();render();break;
    case'list':toggleList(+d.id);save();render();renderSheet();break;
    case'accept':UI.msg=acceptOffer(+d.id);save();render();break;
    case'reject':rejectOffer(+d.id);save();render();break;
    case'tfocus':G.train[d.g].k=+d.k;save();render();break;
    case'tint':G.train[d.g].i=d.v;save();render();break;
    case'hirec':hireCoach(d.r,+d.i);save();render();break;
    case'firec':releaseCoach(d.r);save();render();break;
    case'hires':UI.msg=hireScout(+d.i);save();render();break;
    case'fires':G.staff.scouts.splice(+d.i,1);save();render();break;
    case'sfocus':G.staff.scouts[+d.i].focus=d.v;save();render();break;
    case'help':UI.helpFrom=UI.screen==='title'?'title':'game';UI.screen='help';UI.sheet=null;render();break;
    case'helpback':UI.screen=UI.helpFrom==='title'?'title':'club';render();break;
    case'xsave':UI.sx=JSON.stringify(G);render();break;
    case'isave':{
      let g=null,err='';
      const box=$('#simp'),txt=box?box.value.trim():'';
      if(!txt)err='Paste a saved game into the box first.';
      else{try{g=JSON.parse(txt)}catch(e){err='That is not a saved game. Copy the whole text from Export save.'}}
      if(!err&&!validSave(g))err='That text is not a valid saved game from this version.';
      if(err){UI.msg=err;render();break}
      G=g;initClub(G);UI.save=null;UI.sx='';UI.msg='Saved game loaded. Welcome back to '+G.teams[G.club].name+'.';UI.screen='home';save();render();break;
    }
    case'mend':finishUser();break;
    case'mment':{const s=M.s[mi()];if(s.ment!==d.v){s.ment=d.v;me().ment=d.v;L(M,'t',s.team.short+' change to a '+MENT[d.v].toLowerCase()+' approach.',mi());recalc(M)}mUpdate(true);break}
    case'mform':changeForm(M,mi(),d.v);UI.msel=-1;mUpdate(true);break;
    case'msel':UI.msel=UI.msel===+d.i?-1:+d.i;mUpdate(true);break;
    case'msub':{
      const s=M.s[mi()];
      if(UI.msel>=0&&s.subsUsed<3&&s.on[UI.msel]&&s.bench[+d.i]){doSub(M,mi(),s.on[UI.msel],s.bench[+d.i],false);UI.msel=-1}
      mUpdate(true);break;
    }
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  act(t.dataset.act,t.dataset,{target:e.target,currentTarget:t});
});

// ----- boot -----
async function boot(){
  DEF=buildDefaultDB(20261010);
  UI.setup={db:DEF,sel:null};
  render();
  await initCaps();
  const s=await loadSave();
  if(s&&UI.screen==='title'&&!G){
